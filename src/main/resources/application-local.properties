spring.application.name=aquaica
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/aquaica
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:100705}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG

# Límite de carga de archivos (Evidencias fotográficas de reportes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.enabled=true

