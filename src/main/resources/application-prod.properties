server.port=${PORT:8080}

# Conexión a Base de Datos PostgreSQL en producción
# Soporta variables estándar de Spring Boot, variables de proveedores cloud (PGHOST) o DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:aquaica}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}

# En nuevas instancias cloud se recomienda update para generar tablas si no existen
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Seguridad JWT en producción
jwt.secret=${JWT_SECRET:AquaIca-Secret-Key-Para-JWT-2026-Seguridad-123456789}

