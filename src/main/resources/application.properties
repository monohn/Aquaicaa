server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Límite de carga de archivos (Evidencias fotográficas)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.enabled=true

# Clave secreta para JWT (configurable vía variable de entorno JWT_SECRET en producción)
jwt.secret=${JWT_SECRET:AquaIca-Secret-Key-Para-JWT-2026-Seguridad-123456789}

# Cloudinary (opcional: si se configura en producción, las imágenes se alojan en CDN)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

# Token opcional de apis.net.pe para consultas RENIEC v2
reniec.api.token=${RENIEC_API_TOKEN:}


