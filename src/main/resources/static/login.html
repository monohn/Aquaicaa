<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaIca | Iniciar sesión</title>

    <link rel="icon" type="image/png" href="images/favicon-64.png">
    <link rel="apple-touch-icon" href="images/favicon-64.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-body">

    <main class="login-page">

        <section class="login-card">

            <div class="login-brand">
                <img
                    src="images/aquaica-logo.png"
                    alt="AquaIca"
                    class="login-logo">
                <div class="login-brand-text">
                    <h1>AquaIca</h1>
                    <span>Sistema de Gestión del Agua</span>
                </div>
            </div>


            <!-- Título -->
            <div class="login-header">

                <h2>Iniciar sesión</h2>

                <p>
                    Ingresa tus credenciales para continuar
                </p>

                <!-- Accesos rápidos de prueba -->
                <div class="demo-accounts-box">
                    <span class="demo-title">Acceso rápido para prueba:</span>
                    <div class="demo-chips">
                        <button type="button" class="demo-chip" onclick="fillDemoCredentials('admin', 'admin123456')">
                            <span class="chip-badge admin">Admin</span>
                            <span class="chip-user">admin</span>
                        </button>
                        <button type="button" class="demo-chip" onclick="fillDemoCredentials('tecnico1', 'tecnico123456')">
                            <span class="chip-badge tecnico">Técnico</span>
                            <span class="chip-user">tecnico1</span>
                        </button>
                    </div>
                </div>

            </div>


            <!-- Formulario -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Mensaje de error -->
                <div
                    id="loginMessage"
                    class="login-message"
                    hidden>
                </div>


                <button
                    type="submit"
                    class="login-button">

                    Iniciar sesión

                </button>
            <div class="register-link">
    <span>¿No tienes una cuenta?</span>
    <a href="registro.html">Regístrate</a>
</div>
<div style="text-align: center; margin-top: 14px;">
    <a href="index.html" style="font-size: 13px; color: #5d7389; text-decoration: none; font-weight: 500;">← Volver al muro comunitario</a>
</div>

            </form>


            <!-- Footer -->
            <div class="login-footer">

                <span>AquaIca © 2026</span>

                <span>
                    Sistema de gestión municipal
                </span>

            </div>

        </section>
    </main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
