<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AquaIca - Reporta un problema con tu servicio de agua.">

    <title>AquaIca | Reportar problema</title>

    <link rel="icon" type="image/png" href="images/favicon-64.png">
    <link rel="apple-touch-icon" href="images/favicon-64.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reporte.css">
</head>

<body class="reporte-body">

    <header class="public-header">
        <a href="index.html" class="public-brand" style="text-decoration:none; color:inherit;">
            <img src="images/aquaica-logo.png" alt="AquaIca" class="public-logo-img">
            <div>
                <h2>AquaIca</h2>
                <span>Reporte ciudadano</span>
            </div>
        </a>

        <nav class="public-nav">
            <a href="index.html" class="login-link">Volver al feed</a>
        </nav>
    </header>

    <main class="reporte-container">

        <section class="reporte-card">

            <div class="reporte-header">
                <h1>Reportar incidencia</h1>
                <p>Completa estos pocos pasos. Tarda menos de 1 minuto.</p>
            </div>

            <form id="reporteForm" novalidate>

                <!-- 1. DNI o Vía pública -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="codigoSuministro">Tu DNI (8 dígitos)</label>
                        <button type="button" id="btnSinSuministro" class="btn-link-simple">Sin DNI (vía pública)</button>
                    </div>

                    <input
                        type="text"
                        inputmode="numeric"
                        id="codigoSuministro"
                        name="codigoSuministro"
                        placeholder="Ej: 74125896 o código de suministro"
                        maxlength="20"
                        autocomplete="off"
                    >

                    <div id="dniEstadoInline" class="dni-estado-inline" style="display:none;"></div>

                    <div id="nombreManualWrap" style="display:none; margin-top:8px;">
                        <input
                            type="text"
                            id="nombreManualInput"
                            placeholder="Tu nombre (opcional)"
                            maxlength="120"
                        >
                    </div>
                </div>

                <!-- 2. Ubicación -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="direccionIncidencia">Ubicación exacta</label>
                        <button type="button" class="btn-link-simple" id="btnGeolocManual">
                            <span id="btnGeolocTxt">Usar mi GPS</span>
                        </button>
                    </div>

                    <input
                        type="text"
                        id="direccionIncidencia"
                        name="direccionIncidencia"
                        placeholder="Calle, referencia o distrito en Ica"
                    >
                    <small id="geolocEstado" class="hint-simple">Detectaremos tu ubicación si concedes permiso.</small>
                    <input type="hidden" id="reporteLatitud" name="latitud">
                    <input type="hidden" id="reporteLongitud" name="longitud">
                </div>

                <!-- 3. Tipo de problema (1 toque) -->
                <div class="form-group">
                    <label>¿Qué problema hay?</label>
                    <input type="hidden" id="tipoProblema" name="tipoProblema">
                    <div class="tipo-chips" id="tipoChips">
                        <button type="button" class="tipo-chip" data-valor="FUGA_AGUA">Fuga de agua</button>
                        <button type="button" class="tipo-chip" data-valor="CORTE_AGUA">Corte / Sin agua</button>
                        <button type="button" class="tipo-chip" data-valor="BAJA_PRESION">Baja presión</button>
                        <button type="button" class="tipo-chip" data-valor="OTRO">Otro</button>
                    </div>
                </div>

                <!-- 4. Descripción -->
                <div class="form-group">
                    <label for="descripcion">Descripción breve</label>
                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="3"
                        placeholder="Ej: Tubería rota frente al parque..."
                    ></textarea>
                </div>

                <!-- 5. Foto (opcional, compresión automática) -->
                <div class="form-group">
                    <label for="evidencia">Foto (opcional)</label>

                    <div class="file-upload" id="fileUploadWrap">
                        <input
                            type="file"
                            id="evidencia"
                            name="evidencia"
                            accept="image/*"
                        >
                        <label for="evidencia" class="file-upload-label">
                            <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l2-3h4l2 3"/><circle cx="12" cy="13.5" r="3"/></svg>
                            <span id="fileNameDisplay">Tocar para tomar o elegir foto</span>
                        </label>
                    </div>

                    <div id="evidenciaPreviewWrap" class="evidencia-preview-wrap" style="display:none;">
                        <img id="evidenciaPreviewImg" src="" alt="Vista previa">
                        <div class="evidencia-preview-meta">
                            <span id="evidenciaPreviewInfo">Imagen lista</span>
                            <button type="button" id="btnQuitarFoto" class="btn-quitar-foto">Quitar</button>
                        </div>
                    </div>
                </div>

                <div id="reporteMensaje" class="reporte-mensaje"></div>

                <div class="form-actions">
                    <button type="submit" class="submit-button">Enviar reporte</button>
                </div>

            </form>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/reporte.js"></script>
</body>

</html>
